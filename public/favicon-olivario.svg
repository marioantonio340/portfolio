<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0B132B" />
  <g transform="translate(8, 8) scale(0.4)">
    
    <g id="olivario-symbol">
      <defs>
        <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#166534" />
          <stop offset="45%" stop-color="#22C55E" />
          <stop offset="100%" stop-color="#84CC16" />
        </linearGradient>
        <linearGradient id="techRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0F172A" />
          <stop offset="60%" stop-color="#1E3A8A" />
          <stop offset="100%" stop-color="#0284C7" />
        </linearGradient>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>

      <!-- Anel Estrutural Externo ("O" em Geometria de Alta Tecnologia) -->
      <path d="M 60 10 C 32.38 10 10 32.38 10 60 C 10 87.62 32.38 110 60 110 C 78.5 110 94.7 99.8 103.2 84.6 C 98.4 86.8 93 88 87.5 88 C 65.4 88 47.5 70.1 47.5 48 C 47.5 33.5 55.2 20.8 66.8 13.9 C 64.6 13.3 62.3 10 60 10 Z"
            fill="url(#techRingGrad)" />

      <!-- Folha de Oliveira / Vetor de Impulso Ascendente (Crescimento & Vida) -->
      <path d="M 60 10 C 74 26 88 48 88 66 C 88 80.36 75.46 92 60 92 C 44.54 92 34 80.36 34 66 C 34 46 48 24 60 10 Z"
            fill="url(#leafGrad)" />

      <!-- Nervura / Linha de Circuito Digital -->
      <path d="M 60 22 L 60 76"
            stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 7" />

      <!-- Conectores / Tech Nodes -->
      <circle cx="60" cy="76" r="4.5" fill="#FFFFFF" />
      <circle cx="92" cy="40" r="5.5" fill="#22C55E" />
      <circle cx="26" cy="78" r="4" fill="#38BDF8" opacity="0.9" />
    </g>
    
  </g>
</svg>